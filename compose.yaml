services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: shopfloor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: shopfloor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfloor -d shopfloor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the postgres service}
      SHOPFLOOR_REVIEW_MEMORY: ${SHOPFLOOR_REVIEW_MEMORY:-false}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set webhook secret}
      SHOPFLOOR_REVIEW_ONLY: ${SHOPFLOOR_REVIEW_ONLY:-false}
      SHOPFLOOR_TRIGGER_LABEL: ${SHOPFLOOR_TRIGGER_LABEL:-}
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: .env.worker
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SHOPFLOOR_REVIEW_MEMORY: ${SHOPFLOOR_REVIEW_MEMORY:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3011').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
    stop_grace_period: 65m
    restart: unless-stopped
volumes:
  postgres-data:
