name: Shopfloor on Shopfloor
on:
  issues:
    types: [opened, edited, closed, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, closed, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted]

jobs:
  shopfloor:
    # Mutually exclusive with dogfood-review.yml on the PR event surface.
    # Non-PR events (issues, issue_comment) always proceed; PR/PR-review events
    # proceed only when the PR was authored by Shopfloor (body carries the
    # `Shopfloor-Stage:` marker set by src/github/adapter.ts). This keeps
    # the full pipeline off human-authored PRs; dogfood-review.yml handles
    # those with review_only=true.
    if: >-
      !(github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
      || contains(github.event.pull_request.body, 'Shopfloor-Stage:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # All writes go through the Shopfloor GitHub App installation token, so
    # the workflow itself stays on read-only scopes. Shopfloor mints (and
    # refreshes) the App installation token in-process from the client id +
    # private key — no actions/create-github-app-token step needed.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run Shopfloor
        uses: ./
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_app_client_id: ${{ secrets.SHOPFLOOR_GITHUB_APP_CLIENT_ID }}
          github_app_private_key: ${{ secrets.SHOPFLOOR_GITHUB_APP_PRIVATE_KEY }}
          github_app_review_client_id: ${{ secrets.SHOPFLOOR_GITHUB_APP_REVIEW_CLIENT_ID }}
          github_app_review_private_key: ${{ secrets.SHOPFLOOR_GITHUB_APP_REVIEW_PRIVATE_KEY }}
          ssh_signing_key: ${{ secrets.SSH_SIGNING_KEY }}
          trigger_label: "shopfloor:trigger"
