name: Shopfloor (Codex)

# Runs the Shopfloor pipeline with OpenAI's Codex agent instead of Claude.
# Selection is global via `agent_provider: codex`; every stage runs through
# Codex. The GitHub auth surfaces (App credentials, review App, GITHUB_TOKEN
# fallback) are identical to the Claude workflow — only the agent backend and
# its auth input change.

on:
  issues:
    types: [opened, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review, closed, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  shopfloor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run Shopfloor
        uses: niranjan94/shopfloor@v2
        with:
          agent_provider: codex
          # Recommended: an OpenAI API key. Unlike a ChatGPT auth.json, it does
          # not expire mid-run, so it is the right choice for long implement
          # stages (impl_timeout_ms defaults to 60 minutes).
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          # Alternative: a ChatGPT-managed auth.json supplied verbatim. It is
          # re-seeded into a run-scoped temp CODEX_HOME on every run, and any
          # in-run refresh is discarded — a token that expires mid-run surfaces
          # as a Codex auth failure. Re-seeding a stale token is a manual/ops
          # concern. Prefer openai_api_key above for long runs.
          # codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          # GitHub auth is unchanged from the Claude workflow. Shopfloor mints
          # and refreshes the App installation token in-process.
          github_app_client_id: ${{ secrets.SHOPFLOOR_APP_ID }}
          github_app_private_key: ${{ secrets.SHOPFLOOR_APP_KEY }}
          github_app_review_client_id: ${{ secrets.SHOPFLOOR_REVIEW_APP_ID }}
          github_app_review_private_key: ${{ secrets.SHOPFLOOR_REVIEW_APP_KEY }}
          trigger_label: shopfloor
          # Per-stage model ids are provider-neutral strings; set Codex models.
          triage_model: gpt-5-codex
          spec_model: gpt-5-codex
          plan_model: gpt-5-codex
          impl_model: gpt-5-codex
          review_compliance_model: gpt-5-codex
          review_bugs_model: gpt-5-codex
          review_security_model: gpt-5-codex
          review_smells_model: gpt-5-codex
