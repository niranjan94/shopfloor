name: Shopfloor

on:
  issues:
    types: [opened, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review, closed, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  shopfloor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run Shopfloor
        uses: niranjan94/shopfloor@v2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Shopfloor mints (and refreshes) the App installation token
          # in-process from these credentials. No actions/create-github-app-token
          # step needed.
          github_app_client_id: ${{ secrets.SHOPFLOOR_APP_ID }}
          github_app_private_key: ${{ secrets.SHOPFLOOR_APP_KEY }}
          # Optional: a distinct App used to post code reviews so the
          # reviewer identity differs from the PR author. Omit if you do
          # not want the review pipeline to APPROVE / REQUEST_CHANGES on
          # Shopfloor-authored PRs.
          github_app_review_client_id: ${{ secrets.SHOPFLOOR_REVIEW_APP_ID }}
          github_app_review_private_key: ${{ secrets.SHOPFLOOR_REVIEW_APP_KEY }}
          trigger_label: shopfloor
